<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IITR Rides — Icon Set</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --blue: #2f7df6;
    --blue-hover: #1f63d6;
    --blue-dark: #1a4fab;
    --blue-tint: #eef6ff;
    --slate-50: #f8fafc;
    --slate-100: #f1f5f9;
    --slate-200: #e2e8f0;
    --slate-300: #cbd5e1;
    --slate-500: #64748b;
    --slate-600: #475569;
    --slate-900: #0f172a;
    --green: #22c55e;
    --amber: #f59e0b;
    --rose: #f43f5e;

    --icon-size: 26px;
    --icon-stroke: 1.75;
    --icon-color: #0f172a;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--slate-50);
    color: var(--slate-900);
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }

  /* ---------- Header ---------- */
  header {
    background: #fff;
    border-bottom: 1px solid var(--slate-200);
    position: sticky;
    top: 0;
    z-index: 20;
  }
  .header-inner {
    max-width: 1120px;
    margin: 0 auto;
    padding: 18px 28px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .logo {
    width: 44px; height: 44px;
    border-radius: 13px;
    background: var(--blue);
    display: grid; place-items: center;
    color: #fff;
    box-shadow: 0 6px 16px -6px rgba(47,125,246,.55);
    flex-shrink: 0;
  }
  .logo svg { width: 28px; height: 28px; }
  .brand h1 { font-size: 18px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  .brand p { font-size: 12.5px; color: var(--slate-500); margin: 2px 0 0; }
  .brand .accent { color: var(--blue); }
  .spacer { flex: 1; }
  .count-pill {
    font-size: 12px; font-weight: 500;
    color: var(--slate-600);
    background: var(--slate-100);
    border: 1px solid var(--slate-200);
    padding: 6px 12px;
    border-radius: 999px;
  }
  .count-pill b { color: var(--slate-900); }

  /* ---------- Controls ---------- */
  .controls {
    max-width: 1120px;
    margin: 0 auto;
    padding: 18px 28px 4px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .search {
    position: relative;
    flex: 1;
    min-width: 240px;
  }
  .search svg { width: 18px; height: 18px; color: var(--slate-500);
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%); }
  .search input {
    width: 100%;
    font-family: inherit; font-size: 14px;
    padding: 12px 14px 12px 42px;
    border: 1px solid var(--slate-200);
    border-radius: 14px;
    background: #fff;
    color: var(--slate-900);
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .search input::placeholder { color: var(--slate-300); }
  .search input:focus { border-color: var(--blue); box-shadow: 0 0 0 4px var(--blue-tint); }

  .ctl-group {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #fff;
    border: 1px solid var(--slate-200);
    border-radius: 14px;
    padding: 5px;
  }
  .ctl-label {
    font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
    color: var(--slate-500);
    padding: 0 6px 0 8px;
  }
  .seg { display: flex; gap: 3px; }
  .seg button {
    font-family: inherit; font-size: 13px; font-weight: 500;
    color: var(--slate-600);
    border: none; background: transparent;
    padding: 7px 11px;
    border-radius: 9px;
    cursor: pointer;
    transition: background .12s, color .12s;
  }
  .seg button:hover { background: var(--slate-100); }
  .seg button.active { background: var(--blue); color: #fff; }

  .swatches { display: flex; gap: 6px; padding: 2px 4px; }
  .swatch {
    width: 24px; height: 24px;
    border-radius: 8px;
    border: 2px solid transparent;
    cursor: pointer;
    padding: 0;
    position: relative;
    transition: transform .12s;
  }
  .swatch:hover { transform: scale(1.08); }
  .swatch.active { border-color: var(--blue); box-shadow: 0 0 0 2px #fff inset; }
  .swatch.active.light { border-color: var(--slate-300); }

  .stroke-ctl { display: flex; align-items: center; gap: 10px; padding: 4px 12px 4px 8px; }
  .stroke-ctl input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 96px; height: 4px; border-radius: 4px;
    background: var(--slate-200); outline: none;
  }
  .stroke-ctl input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--blue); cursor: pointer; border: 2px solid #fff;
    box-shadow: 0 1px 4px rgba(15,23,42,.25);
  }
  .stroke-ctl .val { font-size: 12.5px; color: var(--slate-600); min-width: 30px; }

  /* ---------- Sections / Grid ---------- */
  main { max-width: 1120px; margin: 0 auto; padding: 14px 28px 80px; }
  .section { margin-top: 30px; }
  .section-head {
    display: flex; align-items: baseline; gap: 10px;
    margin: 0 0 14px;
  }
  .section-head h2 {
    font-size: 14px; font-weight: 600; margin: 0;
    color: var(--slate-900);
  }
  .section-head span { font-size: 12px; color: var(--slate-300); font-weight: 500; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
    gap: 12px;
  }
  .icon-card {
    background: #fff;
    border: 1px solid var(--slate-200);
    border-radius: 16px;
    padding: 20px 10px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    transition: border-color .14s, box-shadow .14s, transform .14s;
    position: relative;
  }
  .icon-card:hover {
    border-color: var(--blue);
    box-shadow: 0 10px 24px -14px rgba(47,125,246,.5);
    transform: translateY(-2px);
  }
  .icon-card .glyph {
    height: 44px; display: grid; place-items: center;
  }
  .icon-card svg {
    width: var(--icon-size); height: var(--icon-size);
    color: var(--icon-color);
    fill: none;
    stroke: currentColor;
    stroke-width: var(--icon-stroke);
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: width .15s, height .15s;
  }
  .icon-card .name {
    font-size: 11.5px;
    color: var(--slate-500);
    font-family: 'JetBrains Mono', monospace;
    text-align: center;
    width: 100%;
    overflow-wrap: normal;
    line-height: 1.3;
  }
  .icon-card:hover .name { color: var(--blue); }

  .empty {
    text-align: center; padding: 60px 0; color: var(--slate-500);
    font-size: 14px;
  }

  /* ---------- Toast ---------- */
  #toast {
    position: fixed; bottom: 28px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--slate-900); color: #fff;
    font-size: 13px; font-weight: 500;
    padding: 11px 18px; border-radius: 12px;
    box-shadow: 0 12px 30px -8px rgba(15,23,42,.5);
    opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s;
    display: flex; align-items: center; gap: 9px;
    z-index: 50;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast svg { width: 16px; height: 16px; color: var(--green); fill:none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  #toast .mono { color: #93c5fd; }
</style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="logo" id="logoSlot"></div>
      <div class="brand">
        <h1>IITR Rides <span class="accent">Icons</span></h1>
        <p>Campus e-rickshaw app — a consistent stroke icon system</p>
      </div>
      <div class="spacer"></div>
      <div class="count-pill"><b id="countNum">0</b> icons</div>
    </div>
  </header>

  <div class="controls">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="searchInput" type="text" placeholder="Search icons…" autocomplete="off" />
    </div>

    <div class="ctl-group">
      <span class="ctl-label">Size</span>
      <div class="seg" id="sizeSeg">
        <button data-size="20">20</button>
        <button data-size="26" class="active">26</button>
        <button data-size="32">32</button>
        <button data-size="40">40</button>
      </div>
    </div>

    <div class="ctl-group">
      <span class="ctl-label">Color</span>
      <div class="swatches" id="swatches">
        <button class="swatch active" data-color="#0f172a" style="background:#0f172a"></button>
        <button class="swatch" data-color="#2f7df6" style="background:#2f7df6"></button>
        <button class="swatch" data-color="#22c55e" style="background:#22c55e"></button>
        <button class="swatch" data-color="#f59e0b" style="background:#f59e0b"></button>
        <button class="swatch" data-color="#f43f5e" style="background:#f43f5e"></button>
      </div>
    </div>

    <div class="ctl-group">
      <span class="ctl-label">Stroke</span>
      <div class="stroke-ctl">
        <input id="strokeRange" type="range" min="1.25" max="2.25" step="0.25" value="1.75" />
        <span class="val mono" id="strokeVal">1.75</span>
      </div>
    </div>
  </div>

  <main id="gallery"></main>

  <div id="toast">
    <svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 6.5"/></svg>
    <span>Copied <span class="mono" id="toastName"></span></span>
  </div>

<script>
  const ICONS = [
    // ---- Rides & Map ----
    { n:'rickshaw', c:'Rides & Map', s:`<path d="M3.5 13a8.5 8.5 0 0 1 17 0"/><path d="M3.5 13V16H6"/><path d="M9 16h6"/><path d="M18 16h2.5V13"/><path d="M12 5v8"/><circle cx="7.5" cy="17" r="2"/><circle cx="16.5" cy="17" r="2"/>` },
    { n:'pickup', c:'Rides & Map', s:`<circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>` },
    { n:'destination', c:'Rides & Map', s:`<path d="M12 21s-6.5-5.8-6.5-10.5A6.5 6.5 0 0 1 18.5 10.5C18.5 15.2 12 21 12 21z"/><circle cx="12" cy="10.4" r="2.4"/>` },
    { n:'route', c:'Rides & Map', s:`<circle cx="6" cy="6" r="2"/><circle cx="18" cy="16" r="2"/><path d="M6 8v4a4 4 0 0 0 4 4h6"/>` },
    { n:'map', c:'Rides & Map', s:`<path d="M9 4 3 6.2v14l6-2.2 6 2.2 6-2.2V4l-6 2.2z"/><path d="M9 4v14.2M15 6.2v14"/>` },
    { n:'navigation', c:'Rides & Map', s:`<path d="M12 3 19 21l-7-3.6L5 21z"/>` },
    { n:'compass', c:'Rides & Map', s:`<circle cx="12" cy="12" r="9"/><path d="M15.6 8.4l-2.3 4.9-4.9 2.3 2.3-4.9z"/>` },
    { n:'eta', c:'Rides & Map', s:`<circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/>` },
    { n:'charge', c:'Rides & Map', s:`<rect x="3" y="8" width="14" height="9" rx="2.2"/><path d="M20 11v3"/><path d="M9.5 10 7.3 13.2h2.6L8 16.3"/>` },
    { n:'bolt', c:'Rides & Map', s:`<path d="M13 3 5 13.2h5l-1 7.8 9-11.2h-6z"/>` },

    // ---- Navigation ----
    { n:'home', c:'Navigation', s:`<path d="M4 11 12 4l8 7"/><path d="M6 10v9h12v-9"/>` },
    { n:'search', c:'Navigation', s:`<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>` },
    { n:'history', c:'Navigation', s:`<path d="M3.6 12a8.4 8.4 0 1 0 2.6-6.1L3 8.4"/><path d="M3 3.6v4.8h4.8"/><path d="M12 7.8v4.4l3 1.8"/>` },
    { n:'profile', c:'Navigation', s:`<circle cx="12" cy="8" r="4"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/>` },
    { n:'riders', c:'Navigation', s:`<circle cx="9" cy="8" r="3.4"/><path d="M3 19a6 6 0 0 1 12 0"/><path d="M16 4.9a3.4 3.4 0 0 1 0 6.2M17.5 14a6 6 0 0 1 3.5 5"/>` },
    { n:'menu', c:'Navigation', s:`<path d="M4 7h16M4 12h16M4 17h16"/>` },
    { n:'back', c:'Navigation', s:`<path d="M19 12H5M12 5l-7 7 7 7"/>` },
    { n:'chevron', c:'Navigation', s:`<path d="M9 5l7 7-7 7"/>` },
    { n:'expand', c:'Navigation', s:`<path d="M5 9l7 7 7-7"/>` },
    { n:'filter', c:'Navigation', s:`<path d="M4 5h16l-6.2 7.2V19l-3.6 2v-8.8z"/>` },
    { n:'sliders', c:'Navigation', s:`<path d="M4 8h9M17 8h3M4 16h3M11 16h9"/><circle cx="15" cy="8" r="2"/><circle cx="9" cy="16" r="2"/>` },
    { n:'bell', c:'Navigation', s:`<path d="M6 9a6 6 0 0 1 12 0c0 4 1.5 5.6 2 6H4c.5-.4 2-2 2-6z"/><path d="M10 20a2 2 0 0 0 4 0"/>` },
    { n:'plus', c:'Navigation', s:`<path d="M12 5v14M5 12h14"/>` },
    { n:'grid', c:'Navigation', s:`<rect x="4" y="4" width="6" height="6" rx="1.6"/><rect x="14" y="4" width="6" height="6" rx="1.6"/><rect x="4" y="14" width="6" height="6" rx="1.6"/><rect x="14" y="14" width="6" height="6" rx="1.6"/>` },

    // ---- Status ----
    { n:'check', c:'Status & Actions', s:`<path d="M5 12.5l4.5 4.5L19 6.5"/>` },
    { n:'check-circle', c:'Status & Actions', s:`<circle cx="12" cy="12" r="9"/><path d="M8 12l2.8 2.8L16 9"/>` },
    { n:'close', c:'Status & Actions', s:`<path d="M6 6l12 12M18 6 6 18"/>` },
    { n:'x-circle', c:'Status & Actions', s:`<circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>` },
    { n:'info', c:'Status & Actions', s:`<circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 7.6h.01"/>` },
    { n:'alert', c:'Status & Actions', s:`<path d="M12 4 2.5 20.5h19z"/><path d="M12 10v4"/><path d="M12 17.5h.01"/>` },
    { n:'star', c:'Status & Actions', s:`<path d="M12 3.5l2.6 5.7 6.2.7-4.6 4.2 1.2 6.1L12 17.3l-5.6 2.9 1.2-6.1-4.6-4.2 6.2-.7z"/>` },
    { n:'heart', c:'Status & Actions', s:`<path d="M12 20.5S4 14 4 8.8A4.3 4.3 0 0 1 12 6.2 4.3 4.3 0 0 1 20 8.8C20 14 12 20.5 12 20.5z"/>` },
    { n:'shield', c:'Status & Actions', s:`<path d="M12 3.5l7.5 2.8v5.4c0 4.6-3.5 7.4-7.5 8.5-4-1.1-7.5-3.9-7.5-8.5V6.3z"/><path d="M9 12l2 2 4-4"/>` },
    { n:'sos', c:'Status & Actions', s:`<path d="M12 3.5l7.5 2.8v5.4c0 4.6-3.5 7.4-7.5 8.5-4-1.1-7.5-3.9-7.5-8.5V6.3z"/><path d="M12 8.5v4M12 16h.01"/>` },

    // ---- Comms ----
    { n:'phone', c:'Comms', s:`<path d="M5 4h3.5l1.8 4.5-2.3 1.6a11 11 0 0 0 4.9 4.9l1.6-2.3 4.5 1.8V18a2 2 0 0 1-2.2 2A15.5 15.5 0 0 1 3 6.2 2 2 0 0 1 5 4z"/>` },
    { n:'chat', c:'Comms', s:`<path d="M4 5.5h16v10H9l-5 4z"/><path d="M8 9h8M8 12h5"/>` },
    { n:'share', c:'Comms', s:`<circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 10.8 15.8 7.2M8.2 13.2l7.6 3.6"/>` },
    { n:'send', c:'Comms', s:`<path d="M21 3 10.5 13.5M21 3l-6.5 18-4-8-8-4z"/>` },
    { n:'camera', c:'Comms', s:`<rect x="3" y="7" width="18" height="12" rx="2.5"/><path d="M8 7l1.5-2.5h5L16 7"/><circle cx="12" cy="13" r="3"/>` },
    { n:'qr', c:'Comms', s:`<rect x="4" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><path d="M14 14h3v3M20 14v6M14 20h6"/>` },

    // ---- Payments ----
    { n:'wallet', c:'Payments & Offers', s:`<path d="M4 7a2 2 0 0 1 2-2h11v4"/><path d="M4 7v10a2 2 0 0 0 2 2h13a1 1 0 0 0 1-1v-3"/><path d="M21 11h-4a2 2 0 0 0 0 4h4z"/>` },
    { n:'rupee', c:'Payments & Offers', s:`<path d="M8 5h8M8 9h8M16 5c0 3-2.5 4.5-6 4.5H8l7.5 8"/>` },
    { n:'card', c:'Payments & Offers', s:`<rect x="3" y="6" width="18" height="12" rx="2.5"/><path d="M3 10h18M7 14.5h3"/>` },
    { n:'receipt', c:'Payments & Offers', s:`<path d="M6 3.5h12v17l-2-1.4-2 1.4-2-1.4-2 1.4-2-1.4-2 1.4z"/><path d="M9 8h6M9 12h5"/>` },
    { n:'tag', c:'Payments & Offers', s:`<path d="M4 12.5 12 4.5h7.5V12l-8 8z"/><circle cx="15.8" cy="8.2" r="1.2"/>` },
    { n:'offer', c:'Payments & Offers', s:`<path d="M5.5 18.5 18.5 5.5"/><circle cx="8" cy="8" r="2"/><circle cx="16" cy="16" r="2"/>` },
    { n:'gift', c:'Payments & Offers', s:`<rect x="4" y="9" width="16" height="11" rx="1.5"/><path d="M4 13h16M12 9v11"/><path d="M12 9c-1-3-5-3-5-.4S10 9 12 9zM12 9c1-3 5-3 5-.4S14 9 12 9z"/>` },

    // ---- Theme ----
    { n:'sun', c:'Theme', s:`<circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/>` },
    { n:'moon', c:'Theme', s:`<path d="M20 14.5A8 8 0 0 1 9.5 4 7 7 0 1 0 20 14.5z"/>` },
  ];

  const ORDER = ['Rides & Map','Navigation','Status & Actions','Comms','Payments & Offers','Theme'];
  const wrap = (inner) => `<svg viewBox="0 0 24 24">${inner}</svg>`;

  // Logo
  document.getElementById('logoSlot').innerHTML =
    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">${ICONS[0].s}</svg>`;
  document.getElementById('countNum').textContent = ICONS.length;

  const gallery = document.getElementById('gallery');

  function render(q='') {
    const term = q.trim().toLowerCase();
    gallery.innerHTML = '';
    let shown = 0;
    ORDER.forEach(cat => {
      const items = ICONS.filter(i => i.c === cat && (!term || i.n.includes(term) || cat.toLowerCase().includes(term)));
      if (!items.length) return;
      shown += items.length;
      const sec = document.createElement('section');
      sec.className = 'section';
      sec.innerHTML = `<div class="section-head"><h2>${cat}</h2><span>${items.length}</span></div>`;
      const grid = document.createElement('div');
      grid.className = 'grid';
      items.forEach(ic => {
        const card = document.createElement('button');
        card.className = 'icon-card';
        card.type = 'button';
        card.innerHTML = `<span class="glyph">${wrap(ic.s)}</span><span class="name">${ic.n}</span>`;
        card.addEventListener('click', () => copyName(ic.n));
        grid.appendChild(card);
      });
      sec.appendChild(grid);
      gallery.appendChild(sec);
    });
    if (!shown) {
      gallery.innerHTML = `<div class="empty">No icons match “${q}”.</div>`;
    }
  }

  // Search
  document.getElementById('searchInput').addEventListener('input', e => render(e.target.value));

  // Size
  document.getElementById('sizeSeg').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    document.querySelectorAll('#sizeSeg button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    document.documentElement.style.setProperty('--icon-size', b.dataset.size + 'px');
  });

  // Color
  document.getElementById('swatches').addEventListener('click', e => {
    const b = e.target.closest('.swatch'); if (!b) return;
    document.querySelectorAll('.swatch').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    document.documentElement.style.setProperty('--icon-color', b.dataset.color);
  });

  // Stroke
  const range = document.getElementById('strokeRange');
  range.addEventListener('input', e => {
    document.documentElement.style.setProperty('--icon-stroke', e.target.value);
    document.getElementById('strokeVal').textContent = Number(e.target.value).toFixed(2);
  });

  // Toast / copy
  let toastTimer;
  function copyName(name) {
    const tag = `<${name}/>`;
    if (navigator.clipboard) navigator.clipboard.writeText(name).catch(()=>{});
    document.getElementById('toastName').textContent = name;
    const t = document.getElementById('toast');
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
  }

  render();
</script>
